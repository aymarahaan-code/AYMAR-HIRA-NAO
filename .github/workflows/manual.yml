
name: Build AYMAR HIRA NAO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install project packages
        run: npm ci

      - name: Extract Android project
        run: |
          if [ -d android ]; then
            echo "Android project already exists"
          elif [ -f android.zip ]; then
            unzip -q android.zip -d extracted
            if [ -d extracted/android ]; then
              mv extracted/android android
            else
              mv extracted/* android
            fi
          else
            echo "Android project or android.zip not found"
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AYMAR-HIRA-NAO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
